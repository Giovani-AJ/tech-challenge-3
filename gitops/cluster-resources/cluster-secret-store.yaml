# Aplicado depois que o External Secrets Operator já está de pé (a CRD só existe
# a partir daí — por isso não é criado pelo Terraform, ver módulo external-secrets).
# Aponta pro Secrets Manager da região; a autenticação é feita via IRSA do
# ServiceAccount "external-secrets" (role vinda do output eso_irsa_role_arn).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
