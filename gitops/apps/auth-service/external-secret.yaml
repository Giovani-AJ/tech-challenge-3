# Sincroniza DATABASE_URL (do RDS auth-db) e MASTER_KEY (segredo de app) do
# Secrets Manager para um único K8s Secret "auth-secret". Nenhuma credencial
# fica em texto neste repositório — só a referência ao nome do segredo na AWS.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-secret
  namespace: toggle-master
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: auth-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: togglemaster/dev/togglemaster-dev-auth-db
        property: DATABASE_URL
    - secretKey: MASTER_KEY
      remoteRef:
        key: togglemaster/dev/togglemaster-dev-auth-service-app
        property: MASTER_KEY
