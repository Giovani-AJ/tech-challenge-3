# Mesmo racional do auth-service/networkpolicy.yaml. Quem chama flag-service:
# evaluation-service (via FLAG_SERVICE_URL) e ingress-nginx (rota pública /flags).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flag-service-ingress
  namespace: flag-service
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: evaluation-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8002
