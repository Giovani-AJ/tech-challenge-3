# Mesmo racional do auth-service/networkpolicy.yaml. Quem chama targeting-service:
# evaluation-service (via TARGETING_SERVICE_URL) e ingress-nginx (rota pública /targeting).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: targeting-service-ingress
  namespace: targeting-service
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: evaluation-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8003
