# IRSA: substitua arn:aws:iam::681447159486:role/togglemaster-dev-evaluation-service pelo output
# evaluation_service_irsa_role_arn do Terraform. É essa role que dá ao pod
# permissão de sqs:SendMessage, sem nenhuma access key estática.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-service
  namespace: toggle-master
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::681447159486:role/togglemaster-dev-evaluation-service
