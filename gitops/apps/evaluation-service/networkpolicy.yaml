# Mesmo racional do auth-service/networkpolicy.yaml. Nenhum outro microsserviço
# chama evaluation-service diretamente — só o ingress-nginx (rota pública /evaluate).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evaluation-service-ingress
  namespace: evaluation-service
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8004
