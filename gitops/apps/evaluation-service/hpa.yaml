# Requisito mínimo da Fase 2: HPA por CPU pro evaluation-service (o "hot path").
# Precisa do metrics-server rodando no cluster pra funcionar (senão o HPA fica
# com TARGETS "unknown" no kubectl get hpa).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evaluation-service
  namespace: evaluation-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evaluation-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
