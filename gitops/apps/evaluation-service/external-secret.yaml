# SERVICE_API_KEY é a chave que o evaluation-service usa para se autenticar como
# cliente do flag-service/targeting-service. O valor real só existe depois do
# bootstrap do auth-service (POST /admin/keys) — ver docs/RUNBOOK.md. Até lá, o
# Secrets Manager guarda um placeholder e o pod não vai conseguir chamar os outros
# dois serviços (mas sobe normalmente, health check não depende disso).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: evaluation-secret
  namespace: evaluation-service
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: evaluation-secret
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_API_KEY
      remoteRef:
        key: togglemaster/dev/togglemaster-dev-evaluation-service-api-key
        property: SERVICE_API_KEY
