# IRSA: substitua arn:aws:iam::681447159486:role/togglemaster-dev-analytics-service pelo output
# analytics_service_irsa_role_arn do Terraform (permissão de ler/apagar da fila SQS
# e escrever na tabela DynamoDB, sem access key estática).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service
  namespace: analytics-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::681447159486:role/togglemaster-dev-analytics-service
