apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: evaluation-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Giovani-AJ/tech-challenge-3.git
    targetRevision: HEAD
    path: gitops/apps/evaluation-service
  destination:
    server: https://kubernetes.default.svc
    namespace: evaluation-service
  # O HPA é quem manda no numero de replicas a partir daqui — sem isso, o
  # selfHeal do ArgoCD ficaria brigando com o HPA pra voltar ao valor do git.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
