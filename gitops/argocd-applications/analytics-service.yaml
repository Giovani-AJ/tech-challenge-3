apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Giovani-AJ/tech-challenge-3.git
    targetRevision: HEAD
    path: gitops/apps/analytics-service
  destination:
    server: https://kubernetes.default.svc
    namespace: analytics-service
  # O KEDA é quem manda no numero de replicas a partir daqui (inclusive 0) —
  # sem isso, o selfHeal do ArgoCD ficaria brigando com o KEDA.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
