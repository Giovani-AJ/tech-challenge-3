name: CI - auth-service

on:
  pull_request:
    branches: [main]
    paths: ["services/auth-service/**"]
  push:
    branches: [main]
    paths: ["services/auth-service/**"]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: auth-service
  SERVICE_DIR: services/auth-service

permissions:
  id-token: write   # necessário para o OIDC assumir a role na AWS
  contents: write   # necessário pro job final commitar a tag nova em gitops/

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: go build -v ./...
      - run: go test -v ./...

  lint:
    name: Linter (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/auth-service
          args: --timeout=5m

  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Trivy - SCA (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: services/auth-service
          severity: CRITICAL
          exit-code: 1

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: gosec - SAST
        working-directory: services/auth-service
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -confidence high ./...

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Define image tag
        id: tag
        run: echo "image_tag=v1.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        working-directory: services/auth-service
        run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.image_tag }} .

      - name: Trivy - Container Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}
          severity: CRITICAL
          exit-code: 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        run: |
          IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}
          docker tag ${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.image_tag }} "$IMAGE_URI"
          docker push "$IMAGE_URI"

  update-gitops:
    name: Atualiza tag no gitops/ (mesmo repositório)
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Atualiza a tag da imagem no deployment.yaml
        run: |
          IMAGE_TAG=${{ needs.docker-build-push.outputs.image_tag }}
          sed -i -E "s|(image: .*${{ env.ECR_REPOSITORY }}:).*|\1${IMAGE_TAG}|" \
            "gitops/apps/auth-service/deployment.yaml"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "gitops/apps/auth-service/deployment.yaml"
          git commit -m "chore(auth-service): atualiza imagem para ${{ needs.docker-build-push.outputs.image_tag }}" || exit 0
          git pull --rebase origin main
          git push
