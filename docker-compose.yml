# Ambiente local completo (requisito da Fase 2): os 5 microsserviços + os 4
# "bancos de dados" locais — 2 instâncias Postgres, 1 Redis, 1 DynamoDB Local.
# `docker compose up --build` sobe tudo. SQS não tem equivalente local aqui:
# evaluation-service já trata a ausência dele como opcional (loga e segue), e
# analytics-service roda com uma URL de fila fictícia — o consumo real de fila
# é validado no ambiente de nuvem (AWS), não localmente.

services:
  # --- Postgres #1: só o auth-service (isolamento do serviço mais sensível) ---
  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres_auth
    env_file:
      - ./services/auth-service/.env
    ports:
      - "5432:5432"
    volumes:
      - ./services/auth-service/db/init.sql:/docker-entrypoint-initdb.d/01-auth-init.sql
      - pgdata_auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rede-app

  # --- Postgres #2: flag-service + targeting-service ---
  postgres-app:
    image: postgres:15-alpine
    container_name: postgres_app
    env_file:
      - ./services/flag-service/.env
    ports:
      - "5433:5432"
    volumes:
      - ./services/flag-service/db/init.sql:/docker-entrypoint-initdb.d/01-flag-init.sql
      - ./services/targeting-service/db/init.sql:/docker-entrypoint-initdb.d/02-targeting-init.sql
      - pgdata_app:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rede-app

  redis-db:
    image: redis:8.8-alpine
    container_name: redis_db
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - rede-app

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb_local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"
    networks:
      - rede-app

  # Cria a tabela ToggleMasterAnalytics no DynamoDB Local e sai — roda uma vez
  # a cada `docker compose up` (create-table falhando por já existir é ignorado).
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: dynamodb_init
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 3
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name ToggleMasterAnalytics \
          --attribute-definitions AttributeName=event_id,AttributeType=S \
          --key-schema AttributeName=event_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST || true
    networks:
      - rede-app

  app:
    build:
      context: ./services/auth-service
    ports:
      - "8001:8001"
    env_file:
      - ./services/auth-service/.env
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - rede-app

  app-flag:
    build:
      context: ./services/flag-service
    ports:
      - "8002:8002"
    env_file:
      - ./services/flag-service/.env
    depends_on:
      postgres-app:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - rede-app

  app-targeting:
    build:
      context: ./services/targeting-service
    ports:
      - "8003:8003"
    env_file:
      - ./services/targeting-service/.env
    depends_on:
      postgres-app:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - rede-app

  app-evaluation:
    build:
      context: ./services/evaluation-service
    ports:
      - "8004:8004"
    env_file:
      - ./services/evaluation-service/.env
    depends_on:
      app:
        condition: service_started
      app-flag:
        condition: service_started
      app-targeting:
        condition: service_started
      redis-db:
        condition: service_healthy
    networks:
      - rede-app

  app-analytics:
    build:
      context: ./services/analytics-service
    ports:
      - "8005:8005"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_DYNAMODB_TABLE: ToggleMasterAnalytics
      # Sem SQS local equivalente — URL fictícia. O worker loga erro e tenta de
      # novo a cada 10s (não derruba o processo); consumo real é testado na AWS.
      AWS_SQS_URL: "http://dynamodb-local:8000/000000000000/local-queue"
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      app:
        condition: service_started
      app-flag:
        condition: service_started
      app-targeting:
        condition: service_started
      app-evaluation:
        condition: service_started
    networks:
      - rede-app

volumes:
  pgdata_auth:
  pgdata_app:
  redis_data:

networks:
  rede-app:
    driver: bridge
